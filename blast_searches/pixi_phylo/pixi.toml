[workspace]
authors = ["Marina <marina.motamerlo@icm.uu.se>"]
channels = ["conda-forge", "bioconda"]
name = "pixi_phylo"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.13.12,<3.14"
biopython = ">=1.86,<2"
snakemake = ">=9.16.3,<10"
ete4 = ">=4.3.0,<5"
mafft = ">=7.526,<8"
iqtree = ">=3.0.1,<4"
spyder = ">=6.1.3,<7"
pyqt6 = ">=6.8.1,<7"
emboss = { version = ">=6.6.0,<7", channel = "bioconda" }
pymsaviz = { version = ">=0.5.0,<0.6", channel = "bioconda" }

[pypi-dependencies]
ncbi-acc-download = ">=0.2.9, <0.3"
