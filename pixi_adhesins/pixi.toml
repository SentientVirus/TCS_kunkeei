[workspace]
authors = ["Marina <marina.motamerlo@icm.uu.se>"]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
name = "pixi_adhesins"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ete4 = ">=4.3.0,<5"
libxcb = ">=1.17.0,<2"
xcb-proto = ">=1.17.0,<2"
interproscan = ">=5.59_91.0,<6"
python = ">=3.13.13,<3.14"
biopython = ">=1.87,<2"
iqtree = ">=3.1.1,<4"
mafft = ">=7.526,<8"
spyder = ">=6.1.4,<7"
pandas = ">=3.0.2,<4"
ncbi-acc-download = { version = ">=0.2.8,<0.3", channel = "bioconda" }
trimal = { version = ">=1.5.1,<2", channel = "bioconda" }
pymsaviz = ">=0.5.0,<0.6"
blast = { version = ">=2.17.0,<3", channel = "bioconda" }
emboss = { version = ">=6.6.0,<7", channel = "bioconda" }

[pypi-dependencies]
pygenomeviz = ">=1.6.1, <2"
pyqt6 = ">=6.9.1, <7"
