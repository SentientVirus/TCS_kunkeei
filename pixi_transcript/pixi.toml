[workspace]
authors = ["Marina <marina.motamerlo@icm.uu.se>"]
channels = ["conda-forge", "https://conda.anaconda.org/bioconda"]
name = "pixi_transcript"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pandas = ">=2.3.3,<3"
samtools = { version = ">=1.22.1,<2", channel = "bioconda" }
snakemake = ">=9.13.5,<10"
biopython = ">=1.86,<2"
spyder = ">=6.1.0,<7"

[feature.renv.dependencies]
r-base = ">=4.4.3,<4.5"
r-biocmanager = { version = ">=1.30.26,<2", channel = "conda-forge" }
bioconductor-deseq2 = ">=1.46.0,<2"
bioconductor-apeglm = ">=1.28.0,<2"
r-stringr = ">=1.6.0,<2"
r-ape = ">=5.8_1,<6"
bioconductor-noiseq = { version = ">=2.50.0,<3", channel = "bioconda" }

[feature.rnaseq.dependencies]
bwa = { version = ">=0.7.19,<0.8", channel = "bioconda" }
skewer = { version = ">=0.2.2,<0.3", channel = "bioconda" }
bedtools = { version = ">=2.31.1,<3", channel = "bioconda" }
picard = { version = ">=3.4.0,<4", channel = "bioconda" }
fastqc = { version = ">=0.12.1,<0.13", channel = "bioconda" }
multiqc = { version = ">=1.32,<2", channel = "bioconda" }
subread = { version = ">=2.1.1,<3", channel = "bioconda" }

[environments]
renv = ["renv"]
rnaseq = ["rnaseq"]
